<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadoo - Place Your Order</title>
    <link rel="stylesheet" href="orderPage.css">
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap" async defer></script>
</head>
<body>
    <header>
        <nav>
            <div class="logo">Jadoo</div>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Our Services</a></li>
                <li><a href="#">Contact Us</a></li>
            </ul>
            <div class="auth-buttons">
                <button class="login-btn">Login</button>
                <button class="signup-btn">Sign up</button>
            </div>
        </nav>
    </header>

    <main>
        <section class="order-section">
            <div class="form-container">
                <h2>Place Your Order</h2>
                <div class="order-form-wrapper">
                    <!-- Left Column - Form -->
                    <form action="#" method="post" class="order-form">
                        <div class="form-group">
                            <label for="cylinder-type" class="sh-1">Delivery Information</label>
                            <div class="cylinder-options">
                                <input type="radio" class="Tcylinder" name="cylinder-type" value="new">
                                <label for="Tcylinder">New Cylilinder</label>
                                <input type="radio" class="Tcylinder" name="cylinder-type" value="refill">
                                <label for="Tcylinder">Refill Cylinder</label>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="name">Full name of the Receiver *</label>
                            <input type="text" id="name" name="name" required>
                        </div>

                        <div class="form-group">
                            <label for="phone1">Phone number 1 *</label>
                            <input type="text" id="phone1" name="phone1" required>
                        </div>

                        <div class="form-group">
                            <label for="phone2">Phone number 2</label>
                            <input type="text" id="phone2" name="phone2">
                        </div>

                        <div class="form-group">
                            <label for="address">Address *</label>
                            <input type="text" id="address" name="address" required>
                        </div>

                        <div class="form-group">
                            <label for="city">City *</label>
                            <input type="text" id="city" name="city" required>
                        </div>

                        <div class="form-group">
                            <input type="checkbox" id="terms" name="terms" required>
                            <label for="terms">I have read and agree to the Terms and Conditions.</label>
                        </div>
                    </form>

                    <!-- Right Column - Map and Cylinder Selection -->
                    <div class="order-details">
                        <div class="form-group">
                            <label>Select delivery location on the map *</label>
                            <div id="map" class="map-container"></div>
                        </div>

                        <div class="form-group">
                            <label>Select Gas Cylinder size option *</label>
                            <div class="cylinder-selection">
                                <div class="cylinder">
                                    <input type="radio" id="large-cylinder" name="cylinder-size" value="large" required>
                                    <label for="large-cylinder">
                                        <img src="cylinder1.png" alt="Large Cylinder">
                                        <p>Large - Rs. 3,500</p>
                                    </label>
                                </div>
                                <div class="cylinder">
                                    <input type="radio" id="medium-cylinder" name="cylinder-size" value="medium" required>
                                    <label for="medium-cylinder">
                                        <img src="cylinder2.png" alt="Medium Cylinder">
                                        <p>Medium - Rs. 2,500</p>
                                    </label>
                                </div>
                                <div class="cylinder">
                                    <input type="radio" id="small-cylinder" name="cylinder-size" value="small" required>
                                    <label for="small-cylinder">
                                        <img src="cylinder3.png" alt="Small Cylinder">
                                        <p>Small - Rs. 1,500</p>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="order-btn-container">
                    <button type="submit" class="order-btn">Order Now</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <div class="contact-info">
                <p>query@lehladakhindia.com</p>
                <p>Don't wait any longer. Contact us!</p>
                <p>+(91) 11 – 4242 3100</p>
            </div>
            <ul class="quick-links">
                <li><a href="#">About Us</a></li>
                <li><a href="#">Our Services</a></li>
                <li><a href="#">SiteMap</a></li>
                <li><a href="#">Sign In</a></li>
                <li><a href="#">FAQs</a></li>
            </ul>
            <div class="social-media">
                <a href="#"><img src="facebook-icon.png" alt="Facebook"></a>
                <a href="#"><img src="twitter-icon.png" alt="Twitter"></a>
                <a href="#"><img src="instagram-icon.png" alt="Instagram"></a>
            </div>
        </div>
    </footer>

    <script>
        function initMap() {
            const map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 7.8731, lng: 80.7718 }, // Sri Lanka
                zoom: 8,
            });

            let marker;

            google.maps.event.addListener(map, 'click', function(event) {
                placeMarker(event.latLng);
            });

            function placeMarker(location) {
                if (marker) {
                    marker.setPosition(location);
                } else {
                    marker = new google.maps.Marker({
                        position: location,
                        map: map
                    });
                }
            }
        }
    </script>
</body>
</html>
