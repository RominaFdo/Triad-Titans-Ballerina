<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Create Account Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="signupstyles.css"> <!-- Link to the external CSS file -->
</head>
<body>

<div class="container">
    <h2>Create Account</h2>

    <!-- Customer Details Section -->
    <fieldset>
        <legend>Customer Details</legend>
        <table>
            <tr>
                <td><label for="first-name">First Name</label></td>
                <td><input type="text" id="first-name" name="first-name" placeholder="Enter your first name" required></td>
            </tr>
            <tr>
                <td><label for="last-name">Last Name</label></td>
                <td><input type="text" id="last-name" name="last-name" placeholder="Enter your last name" required></td>
            </tr>
            <tr>
                <td><label for="nic">NIC</label></td>
                <td><input type="text" id="nic" name="nic" placeholder="Enter your NIC" required></td>
            </tr>
            <tr>
                <td><label for="town">Nearest Town</label></td>
                <td><input type="text" id="town" name="town" placeholder="Enter nearest town" required></td>
            </tr>
            <tr>
                <td><label for="address">Address</label></td>
                <td><input type="text" id="address" name="address" placeholder="Enter your address" required></td>
            </tr>
            <tr>
                <td><label for="whatsapp">WhatsApp Number</label></td>
                <td><input type="text" id="whatsapp" name="whatsapp" placeholder="Enter WhatsApp number" required></td>
            </tr>
            <tr>
                <td><label for="contact1">Contact Number i</label></td>
                <td><input type="text" id="contact1" name="contact1" placeholder="Enter contact number i" required></td>
            </tr>
            <tr>
                <td><label for="contact2">Contact Number ii</label></td>
                <td><input type="text" id="contact2" name="contact2" placeholder="Enter contact number ii" required></td>
            </tr>
        </table>
    </fieldset>

    <!-- Log In Details Section -->
    <fieldset>
        <legend>Log In Details</legend>
        <table>
            <tr>
                <td><label for="email">Email</label></td>
                <td><input type="email" id="email" name="email" placeholder="Enter your email" required></td>
            </tr>
            <tr>
                <td><label for="password">Password</label></td>
                <td><input type="password" id="password" name="password" placeholder="Enter your password" required></td>
            </tr>
            <tr>
                <td><label for="confirm-password">Confirm Password</label></td>
                <td><input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required></td>
            </tr>
        </table>
    </fieldset>

    <button type="submit" class="signup-btn">Sign Up</button>
</div>

</body>
</html>
