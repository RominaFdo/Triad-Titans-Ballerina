<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Driver Details</title>
    <link rel="stylesheet" href="regDriverstyles.css">
</head>
<body>
    <div class="form-container">
        <h1>Add Driver Details</h1>
        <form class="driver-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name" placeholder="Enter First Name">
                </div>
                <div class="form-group">
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" placeholder="Enter Last Name">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="nic">NIC</label>
                    <input type="text" id="nic" placeholder="Enter NIC">
                </div>
                <div class="form-group">
                    <label for="town">Nearest Town</label>
                    <input type="text" id="town" placeholder="Enter Nearest Town">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" placeholder="Enter Address">
                </div>
                <div class="form-group">
                    <label for="whatsapp">Whatsapp Number</label>
                    <input type="text" id="whatsapp" placeholder="Enter Whatsapp Number">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="license">Licence Number</label>
                    <input type="text" id="license" placeholder="Enter Licence Number">
                </div>
                <div class="form-group">
                    <label for="vehicle">Vehicle Number</label>
                    <input type="text" id="vehicle" placeholder="Enter Vehicle Number">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="contact1">Contact Number i</label>
                    <input type="text" id="contact1" placeholder="Enter Contact Number">
                </div>
                <div class="form-group">
                    <label for="contact2">Contact Number ii</label>
                    <input type="text" id="contact2" placeholder="Enter Contact Number">
                </div>
            </div>
            <button type="submit" class="submit-btn">Add Driver</button>
        </form>
    </div>
</body>
</html>
