<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Driver Details</title>
    <link rel="stylesheet" href="regDriverstyles.css">
</head>
<body>
    <div class="form-container">
        <h1>Add Driver Details</h1>
        <form class="driver-form" method="post" action="http://localhost:8080/driver/add">
            <div class="form-row">
                <div class="form-group">
                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name" placeholder="Enter First Name" name="Fname">
                </div>
                <div class="form-group">
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" placeholder="Enter Last Name"name="Lname">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="nic">NIC</label>
                    <input type="text" id="nic" placeholder="Enter NIC"name="NIC">
                </div>
                <div class="form-group">
                    <label for="town">Nearest Town</label>
                    <input type="text" id="town" placeholder="Enter Nearest Town"name="NearestTown">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" placeholder="Enter Address"name="Address">
                </div>
                <div class="form-group">
                    <label for="whatsapp">Whatsapp Number</label>
                    <input type="text" id="whatsapp" placeholder="Enter Whatsapp Number" name="WhatsAppNo">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="license">Licence Number</label>
                    <input type="text" id="license" placeholder="Enter Licence Number"name="LicenceNo">
                </div>
                <div class="form-group">
                    <label for="vehicle">Vehicle Number</label>
                    <input type="text" id="vehicle" placeholder="Enter Vehicle Number"name="VehicalNo">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="contact1">Contact Number i</label>
                    <input type="text" id="contact1" placeholder="Enter Contact Number"name="Cont.No1">
                </div>
                <div class="form-group">
                    <label for="contact2">Contact Number ii</label>
                    <input type="text" id="contact2" placeholder="Enter Contact Number" name="Cont.No2">
                </div>
            </div>
            <input type="submit" class="submit-btn" value="Add Driver">
        </form>
    </div>
</body>
</html>
